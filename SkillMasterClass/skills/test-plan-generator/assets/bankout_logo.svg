<svg viewBox="0 0 640 200" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bankoutGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B3D91"/>
      <stop offset="100%" stop-color="#1E6FD9"/>
    </linearGradient>
  </defs>

  <!-- Icon: stylized bank/column mark inside a rounded square -->
  <g transform="translate(20,20)">
    <rect x="0" y="0" width="160" height="160" rx="32" fill="url(#bankoutGrad)"/>
    <!-- roof triangle -->
    <path d="M20 62 L80 26 L140 62 Z" fill="#FFFFFF"/>
    <!-- base line -->
    <rect x="18" y="128" width="124" height="12" rx="4" fill="#FFFFFF"/>
    <!-- columns -->
    <rect x="32" y="70" width="14" height="52" rx="3" fill="#FFFFFF"/>
    <rect x="62" y="70" width="14" height="52" rx="3" fill="#FFFFFF"/>
    <rect x="92" y="70" width="14" height="52" rx="3" fill="#FFFFFF"/>
    <rect x="122" y="70" width="14" height="52" rx="3" fill="#FFFFFF"/>
  </g>

  <!-- Wordmark -->
  <text x="210" y="95" font-family="'Helvetica Neue', Arial, sans-serif" font-size="58" font-weight="700" fill="#0B3D91">Bank<tspan fill="#1E6FD9">out</tspan></text>
  <text x="212" y="128" font-family="Arial, sans-serif" font-size="18" letter-spacing="4" fill="#5A7189">YOUR MONEY, YOUR MOVE</text>
</svg>
